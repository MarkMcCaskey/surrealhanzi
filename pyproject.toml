[project]
name = "surrealhanzi"
version = "0.1.0"
description = "Render Chinese characters from IDS (Ideographic Description Sequences) to SVG"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
download = ["requests"]
site = ["pyyaml"]
dictgen = ["anthropic", "pyyaml", "cairosvg"]
inline-grade = ["playwright", "pillow", "pyyaml"]

[tool.setuptools.packages.find]
include = ["surrealhanzi*"]

[project.scripts]
surrealhanzi = "surrealhanzi.cli:main"
