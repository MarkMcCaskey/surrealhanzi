id: blade-carved-grove
ids: ⿱⿰⿻三丨刀木
svg: blade-carved-grove.svg
title: Blade-Carved Grove
pronunciation: dāo
bopomofo: ㄉㄠ
meaning: A grove or stand of trees that has been carefully pruned or shaped by blade
  work
formation: phono-semantic
definitions:
- zh: 以刃修整之林木，刻意栽培成形者
  en: Trees or groves that have been deliberately shaped through careful cutting and
    pruning
- zh: 喻指經過精心雕琢之事物
  en: Metaphorically refers to something that has been meticulously crafted or refined
- zh: 文人筆下經營慘淡之作品
  en: In literary contexts, works that show painstaking effort and deliberate artistry
etymology: This character speaks to the ancient Chinese understanding that true beauty
  emerges not from wild growth, but from the marriage of natural vitality and human
  intention. The three horizontal strokes suggest the ordered layers of a cultivated
  garden, while the blade component reveals the tool of transformation. It is a character
  that should exist in our gardens and our poetry alike, yet somehow was never written.
source:
  work: 《說文解字》
  gloss: ⿱⿰⿻三丨刀木，刃治林木也。刀聲。都勞切。
components:
- char: 三
  meaning: 三
- char: 丨
  meaning: 丨
- char: 刀
  meaning: knife/blade
- char: 木
  meaning: wood/tree
examples:
- text: 園中⿱⿰⿻三丨刀木成行，皆匠心獨運
  translation: The shaped groves in the garden stand in rows, each showing unique
    craftsmanship
  style: classical
- text: 此詩如⿱⿰⿻三丨刀木，雖見斧鑿，卻不失天然
  translation: This poem is like a pruned grove—though showing the artist's hand,
    it retains natural grace
  style: contemporary
related:
- char: 栽
  pinyin: zāi
  gloss: to plant, cultivate
- char: 雕
  pinyin: diāo
  gloss: to carve, sculpt
- char: 修
  pinyin: xiū
  gloss: to trim, cultivate
tags:
- cultivation
- artistry
- garden
- craft
