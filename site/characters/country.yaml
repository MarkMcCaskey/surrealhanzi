id: country
ids: "⿴囗⿰人人"
svg: country.svg
title: People's Enclosure
pronunciation: zhòng
meaning: People gathered within walls—a nation defined by its inhabitants
etymology: |
  The traditional character for country, 國 (guó), encloses 玉 (jade) within
  walls—the state defined by its treasure. This variant replaces the jade
  with ⿰人人: two people side by side. A country is not its wealth but its
  people. The enclosure 囗 becomes not a fortress but a gathering place.
components:
  - char: 囗
    meaning: enclosure, walls
    role: outer
  - char: 人
    meaning: person
    role: inner-left
  - char: 人
    meaning: person
    role: inner-right
examples:
  - text: 真正的⿴囗⿰人人，是以人为本的国家。
    translation: "A true people's-enclosure is a nation built around its people."
tags: [political, humanist, structural]
